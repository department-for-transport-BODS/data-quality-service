name: PyTest
on:
  pull_request:
    branches:
    - 'dev'
    - '!test'
    - '!main'
    paths:
    - 'src/**'
    - 'tests/**'

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # 6.3.0
      with:
        python-version: 3.11
        cache: 'pip'
        cache-dependency-path: |
          ./src/boilerplate/requirements.txt
          ./tests/requirements.txt

    - name: Install Dependencies
      run: |
        sudo apt update -y && \
          sudo apt install -y libpq-dev

        python -m pip install --upgrade pip
        pip install -r ./src/boilerplate/requirements.txt
        pip install -r ./tests/requirements.txt

    - name: Test with PyTest
      run: |
        export PYTHONPATH=src/template
        pytest
